appId: io.despacho.kairo
productName: Kairo
electronVersion: 43.1.1
asar: true
directories:
  output: ../dist-desktop
  buildResources: assets
files:
  - "**/*"
  - "!electron-builder.yml"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: kairo-icon.png
  artifactName: Kairo-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Kairo
  deleteAppDataOnUninstall: false
