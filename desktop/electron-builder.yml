appId: io.despacho.kairo.timer
productName: Kairo Timer
electronVersion: 43.1.1
asar: true
directories:
  output: ../dist-desktop
  buildResources: assets
files:
  - "**/*"
  - "!electron-builder.yml"
extraResources:
  - from: assets
    to: assets
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: kairo-icon.png
  artifactName: Kairo-Timer-Setup-${version}.${ext}
mac:
  target:
    - target: dmg
      arch:
        - arm64
  icon: kairo-icon-mac.png
  category: public.app-category.business
  artifactName: Kairo-Timer-${version}-${arch}.${ext}
  hardenedRuntime: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Kairo Timer
  deleteAppDataOnUninstall: false
